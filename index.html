<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#011E53">
<meta name="mdp-receipt-version" content="V198-LOAN-FOUR-FIELDS-OLD-QR-COMPAT">
<title>Digital Receipt - Maharaaj Digi Point</title>
<style>
:root{--navy:#011E53;--org:#FE6E01;--mut:#6b7280;--ln:#e7e9ee;--th:#011E53;--th2:#0a3aa8}
*{box-sizing:border-box}
html{min-height:100%;background:var(--navy)}
body{margin:0;min-height:100vh;padding:22px 14px 30px;color:#111827;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;background:radial-gradient(900px 420px at 85% 108%,rgba(254,110,1,.55),transparent 60%),radial-gradient(700px 380px at 5% -10%,rgba(77,124,255,.35),transparent 60%),linear-gradient(165deg,#011E53,#04339a 70%,#011E53)}
.wrap{max-width:420px;margin:0 auto}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:up .6s ease both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.top{padding:18px 14px 10px;text-align:center;background:#fff}
.top img{width:172px;height:auto;display:block;margin:0 auto 8px}
.brandName{color:#011E53;font-size:24px;font-weight:900;letter-spacing:.4px;line-height:1.05;margin:0 0 7px;white-space:nowrap}
.brandName .mdp{color:#FE6E01}
.brandStrip{display:block;width:100%;padding:5px;border-radius:8px;background:#011E53;color:#fff;font-size:9.2px;font-weight:800;letter-spacing:.12px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:clip}
.brandAddress{margin-top:6px;color:#1f2937;font-size:12.8px;font-weight:700;line-height:1.2}
.bar{position:relative;height:6px;overflow:hidden;background:linear-gradient(90deg,#011E53,#1d4fd8,#FE6E01,#1d4fd8,#011E53);background-size:200% 100%;animation:flow 3.2s linear infinite}
.bar:after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:glint 2.2s ease-in-out infinite}
@keyframes flow{to{background-position:-200% 0}}@keyframes glint{to{left:130%}}
.bn{position:relative;overflow:hidden;margin:14px 16px 0;border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;color:#fff;background:linear-gradient(135deg,var(--th),var(--th2));box-shadow:0 10px 20px -8px var(--th);animation:up .6s .1s ease both}
.bn small{display:none!important}.bn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.bn:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.bn .bi{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.bn svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn b{display:block;font-size:16px;letter-spacing:.2px;line-height:1.15;white-space:nowrap}
.hero{text-align:center;padding:18px 20px 6px;animation:up .6s .2s ease both}.lbl{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--mut);text-transform:uppercase}.amt{font-size:42px;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1.15}.amt i{font-style:normal;color:var(--th);margin-right:4px}.svc{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:99px;background:#eef2ff;color:var(--th);font-weight:700;font-size:13px}
.brk{margin:9px 18px 0;border:1px solid #dbe5f3;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(1,30,83,.05);animation:up .6s .2s ease both}
.brk .l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;margin:2px 5px;border:1px solid #e6edf7;border-radius:10px;background:#f8fbff}.brk .l span{color:#667085;font-size:14px;font-weight:600}.brk .l b{font-size:17px;color:#111827;white-space:nowrap}
.brk .t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;margin-top:3px;color:#fff;background:linear-gradient(135deg,var(--th),var(--th2))}.brk .t span{font-weight:800;letter-spacing:.8px;font-size:14px}.brk .t b{font-size:25px;font-weight:800;white-space:nowrap}
.tear{margin:10px 18px 3px;border-top:2px dashed var(--ln)}.rows{padding:1px 22px 2px;animation:up .6s .3s ease both}
.metaTop{margin:8px 18px 0;padding:5px 10px;background:#f6f9ff;border:1px solid #dbe5f3;border-radius:16px;box-shadow:0 4px 14px rgba(1,30,83,.05);animation:up .6s .05s ease both}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 9px;margin:2px 0;border:1px solid #e6edf7;border-radius:10px;background:#fbfdff}.row:last-child{margin-bottom:0}.row span:first-child{color:#65748b;font-size:13px;font-weight:700;white-space:nowrap;flex:0 0 92px}.row span:last-child{color:#111827;font-weight:800;text-align:right;word-break:normal;white-space:nowrap;flex:1;min-width:0;font-size:14px}.metaTop .row:nth-child(1){background:#eef6ff;border-color:#d7e8fb}.metaTop .row:nth-child(2){background:#f5f1ff;border-color:#e4dbfb}
.customerTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 18px 0;padding:9px 12px;border:1px solid #d9e7dc;border-radius:16px;background:#f4fff8;box-shadow:0 4px 14px rgba(22,101,52,.05);animation:up .6s .12s ease both;min-height:50px}.customerTop .cnm{display:inline;color:#111827;font-size:15px;font-weight:800;letter-spacing:.1px;line-height:1.2;white-space:nowrap}.customerTop .cnm:before{content:"CUSTOMER NAME: ";display:inline;color:#2f7d4a;font-size:13px;font-weight:500;letter-spacing:.2px}.customerTop .cmob{display:block;color:#355066;font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.detailsBox{margin:8px 18px 0;border:1px solid #dbe5f3;border-radius:16px;overflow:hidden;background:#fbfdff;box-shadow:0 4px 14px rgba(1,30,83,.05);animation:up .6s .35s ease both}.detailsBox .drow:nth-child(2n+1){background:#f5faff}.detailsBox .drow:nth-child(2n){background:#f8f5ff}.detailsTitle{padding:8px 12px;background:#eef4fb;color:var(--navy);font-size:11px;font-weight:900;letter-spacing:.8px}.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid #e7eef7;background:#f8fbff}.dpair{padding:7px 10px;min-width:0}.dpair+.dpair{border-left:1px solid #e7eef7}.dlab{display:block;color:#667085;font-size:10.5px;font-weight:800;letter-spacing:.3px;margin-bottom:2px}.dval{display:block;color:#111827;font-size:13.5px;font-weight:800;line-height:1.25;word-break:break-word}.partySender{color:#d92323!important}.partyReceiver{color:#169447!important}.detailsBox .drow.one{grid-template-columns:1fr}.brk .l:nth-child(1){background:#fff9ea;border-color:#f5e7bd}.brk .l:nth-child(2){background:#fff2f0;border-color:#f4d8d3}
.btns{display:flex;gap:10px;padding:6px 20px 14px}.btns a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:10px 8px;border-radius:12px}.b1{background:var(--navy);color:#fff}.b2{background:#fff3e8;color:#c24e00;border:1px solid #ffd2ad}.thx{background:linear-gradient(90deg,var(--navy),#0a3aa8);color:#fff;text-align:center;padding:14px 16px}.thx b{display:block;font-size:15px}.thx small{opacity:.8;font-size:12px}.ft{padding:14px 20px 18px;text-align:center;font-size:12px;color:var(--mut)}.bad{padding:30px 22px;text-align:center}.note{max-width:420px;margin:16px auto 0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.72)}
@media(max-width:520px){.customerTop{flex-direction:row;align-items:center}.customerTop .cnm{font-size:14px;white-space:nowrap}.customerTop .cnm:before{font-size:12px}.customerTop .cmob{text-align:right}.row{padding:7px 8px}}
@media(prefers-reduced-motion:reduce){.card,.bn,.hero,.rows,.brk{animation:none}.bar,.bar:after,.bn:after{animation:none}}
</style>
</head>
