<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#011E53">
<title>Digital Receipt - Maharaaj Digi Point</title>
<style>
:root{--navy:#011E53;--org:#FE6E01;--mut:#6b7280;--ln:#e7e9ee;--th:#011E53;--th2:#0a3aa8}
*{box-sizing:border-box}
html{min-height:100%;background:var(--navy)}
body{margin:0;min-height:100vh;padding:22px 14px 30px;color:#111827;
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;
  background:radial-gradient(900px 420px at 85% 108%,rgba(254,110,1,.55),transparent 60%),
             radial-gradient(700px 380px at 5% -10%,rgba(77,124,255,.35),transparent 60%),
             linear-gradient(165deg,#011E53,#04339a 70%,#011E53)}
.wrap{max-width:420px;margin:0 auto}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:up .6s ease both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.top{padding:18px 14px 10px;text-align:center;background:#fff}
.top img{width:172px;height:auto;display:block;margin:0 auto 8px}
.brandName{color:#011E53;font-size:21px;font-weight:900;letter-spacing:.4px;line-height:1.05;margin:0 0 7px;white-space:nowrap}
.brandName .mdp{color:#FE6E01}
.brandStrip{display:block;width:100%;padding:5px 5px;border-radius:8px;background:#011E53;color:#fff;font-size:9.2px;font-weight:800;letter-spacing:.12px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:clip}
.brandAddress{margin-top:6px;color:#1f2937;font-size:12.8px;font-weight:700;line-height:1.2}
/* animated brand line */
.bar{position:relative;height:6px;overflow:hidden;
  background:linear-gradient(90deg,#011E53,#1d4fd8,#FE6E01,#1d4fd8,#011E53);background-size:200% 100%;
  animation:flow 3.2s linear infinite}
.bar:after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:30%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:glint 2.2s ease-in-out infinite}
@keyframes flow{to{background-position:-200% 0}}
@keyframes glint{to{left:130%}}
/* service heading banner */
.bn{position:relative;overflow:hidden;margin:14px 16px 0;border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;color:#fff;
  background:linear-gradient(135deg,var(--th),var(--th2));box-shadow:0 10px 20px -8px var(--th);animation:up .6s .1s ease both}
.bn small{display:none!important}
.bn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.bn:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.bn .bi{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.bn svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn b{display:block;font-size:16px;letter-spacing:.2px;line-height:1.15;white-space:nowrap}
.bn small{display:none}
.hero{text-align:center;padding:18px 20px 6px;animation:up .6s .2s ease both}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.amt{font-size:42px;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1.15}
.amt i{font-style:normal;color:var(--th);margin-right:4px}
.svc{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:99px;background:#eef2ff;color:var(--th);font-weight:700;font-size:13px}
.brk{margin:10px 18px 0;border:1px solid var(--ln);border-radius:16px;overflow:hidden;animation:up .6s .2s ease both}
.brk .l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f1f5}
.brk .l span{color:var(--mut);font-size:14px}
.brk .l b{font-size:17px;color:#111827;white-space:nowrap}
.brk .t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--th),var(--th2))}
.brk .t span{font-weight:800;letter-spacing:.8px;font-size:14px}
.brk .t b{font-size:25px;font-weight:800;white-space:nowrap}
.tear{margin:10px 18px 3px;border-top:2px dashed var(--ln)}
.rows{padding:2px 22px 4px;animation:up .6s .3s ease both}
.row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #f0f1f5}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--mut);font-size:14px;white-space:nowrap}
.row span:last-child{font-weight:700;text-align:right;word-break:break-word}
.detailsBox{margin:12px 18px 0;border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(1,30,83,.05);animation:up .6s .35s ease both}
.detailsTitle{padding:9px 14px;background:#f4f7fb;color:var(--navy);font-size:11px;font-weight:900;letter-spacing:.8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid #f0f1f5}
.dpair{padding:7px 11px;min-width:0}
.dpair + .dpair{border-left:1px solid #f0f1f5}
.dlab{display:block;color:var(--mut);font-size:10.5px;font-weight:800;letter-spacing:.3px;margin-bottom:2px}
.dval{display:block;color:#111827;font-size:14px;font-weight:800;line-height:1.25;word-break:break-word}
.detailsBox .drow.one{grid-template-columns:1fr}
.detailsBox .drow.one .dpair + .dpair{display:none}
.btns{display:flex;gap:10px;padding:8px 20px 18px}
.btns a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:12px 8px;border-radius:12px}
.b1{background:var(--navy);color:#fff}
.b2{background:#fff3e8;color:#c24e00;border:1px solid #ffd2ad}
.thx{background:linear-gradient(90deg,var(--navy),#0a3aa8);color:#fff;text-align:center;padding:14px 16px}
.thx b{display:block;font-size:15px}
.thx small{opacity:.8;font-size:12px}
.ft{padding:14px 20px 18px;text-align:center;font-size:12px;color:var(--mut)}
.bad{padding:30px 22px;text-align:center}
.note{max-width:420px;margin:16px auto 0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.72)}
@media(prefers-reduced-motion:reduce){.card,.bn,.hero,.rows,.brk{animation:none}.bar,.bar:after,.bn:after{animation:none}}
</style>
</head>

  if(/stationary/.test(s))              return {t:"STATIONARY RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"check"};
  if(/xerox|printout/.test(s))          return {t:"XEROX / PRINTOUT RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"check"};
  if(/online service/.test(s))          return {t:"ONLINE SERVICE RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"check"};
  if(/pan card/.test(s))                return {t:"PAN CARD RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"check"};
  if(/pvc card/.test(s))                return {t:"PVC CARD RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"card"};
  if(/photo print/.test(s))             return {t:"PHOTO PRINT RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"card"};
  if(/aadhaar lamination/.test(s))      return {t:"AADHAAR LAMINATION RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"card"};
  if(/train ticket/.test(s))             return {t:"TRAIN TICKET RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"card"};
  if(/bus ticket/.test(s))               return {t:"BUS TICKET RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"card"};
  if(/online|other/.test(s))             return {t:"ONLINE SERVICE RECEIPT",s:"",a:"#0a3aa8",b:"#011E53",i:"check"};
  return {t:(String(svc||"RECEIPT").toUpperCase()+" RECEIPT"),s:"",a:"#0a3aa8",b:"#011E53",i:"check"};
}
function b64ToUtf8(s){
  s=String(s||"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  try{
    var bin=atob(s),bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(window.TextDecoder) return new TextDecoder("utf-8").decode(bytes);
    var esc=""; for(var j=0;j<bytes.length;j++) esc+="%"+("0"+bytes[j].toString(16)).slice(-2);
    return decodeURIComponent(esc);
  }catch(e){return ""}
}
function parseReceipt(h){
  h=(h||"").replace(/^#/ , "");
  if(!h) return null;
  /* V4.183 full-particulars QR: #v2/<base64url-json> */
  if(h.indexOf("v2/")===0){
    try{
      var data=JSON.parse(b64ToUtf8(h.slice(3)));
      if(!data || !data.n || !data.s || !isFinite(parseFloat(data.a))) return null;
      var d="", ds=String(data.d||"");
      if(/^\d{12}$/.test(ds)){
        var hh=+ds.slice(8,10),ap=hh>=12?"PM":"AM"; hh=hh%12||12;
        d=ds.slice(6,8)+"-"+ds.slice(4,6)+"-"+ds.slice(0,4)+", "+(hh<10?"0":"")+hh+":"+ds.slice(10,12)+" "+ap;
      }
      return {
        no:String(data.n||""), svc:String(data.s||""), amt:parseFloat(data.a)||0, chg:parseFloat(data.c)||0,
        when:d, name:String(data.cn||""), mobile:String(data.cm||""), details:Array.isArray(data.p)?data.p:[], mode:String(data.m||""), qty:data.q, rate:data.r
      };
    }catch(e){ return null; }
  }
  /* Backward-compatible old QR format */
  var p=h.split("/").map(function(s){try{return decodeURIComponent(s).replace(/_/g," ")}catch(e){return s}});
  if(p.length<4) return null;
  var amt=parseFloat(p[2]);
  if(!isFinite(amt)) return null;
  var old=/^\d{12}$/.test(p[3]),chg=0,i=3;
  if(!old){ if(p.length<5) return null; chg=parseFloat(p[3]); if(!isFinite(chg)) chg=0; i=4; }
  var when="";
  if(/^\d{12}$/.test(p[i])){
    var d=p[i],hh=+d.slice(8,10),ap=hh>=12?"PM":"AM";
    hh=hh%12||12;
    when=d.slice(6,8)+"-"+d.slice(4,6)+"-"+d.slice(0,4)+", "+(hh<10?"0":"")+hh+":"+d.slice(10,12)+" "+ap;
  }
  return {no:p[0],svc:p[1],amt:amt,chg:chg,when:when,name:p[i+1]||"",cno:p[i+2]||"",mobile:"",details:[],mode:""};
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "&#8377; "+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
var DETAIL_LABELS={
  BN:"BENEFICIARY",BK:"BANK",AC:"ACCOUNT NO",GW:"GATEWAY",CN:"CONSUMER NO",BD:"BILL DETAILS",NM:"CONSUMER NAME",PM:"PAYMENT MODE",
  TX:"ROINET TXN ID",RC:"RECEIVER",GM:"GPAY/UPI NO",VP:"VPA ID",UR:"UPI REF NO",PB:"PAID BY",MB:"MOBILE NO",PV:"PAID VIA",LD:"LOAN DETAILS",DT:"DETAILS",
  SN:"பணம் அனுப்புபவர்",SM:"மொபைல் எண்",RN:"பணம் பெறுபவர்",RM:"மொபைல் எண்",UT:"UTR எண்",CM:"CUSTOMER NAME",PN:"PRODUCT NAME",PC:"PRODUCT CODE",PD:"PRODUCT DETAILS",TA:"TOTAL AMOUNT"
};
function labelText(code){
  var c=String(code||"");
  if(/^T\d+$/.test(c)) return "TXN ID "+c.slice(1);
  return DETAIL_LABELS[c]||c;
}
function renderDetailRows(details){
  var out="";
  for(var i=0;i<details.length;i++){
    var row=details[i]||[];
    if(row.length>=4){
      out+='<div class="drow"><div class="dpair"><span class="dlab">'+esc(labelText(row[0]))+'</span><span class="dval">'+esc(row[1]||"-")+'</span></div>'+ 
           '<div class="dpair"><span class="dlab">'+esc(labelText(row[2]))+'</span><span class="dval">'+esc(row[3]||"-")+'</span></div></div>';
    }else if(row.length>=2 && row[0]){
      out+='<div class="drow one"><div class="dpair"><span class="dlab">'+esc(row[0])+'</span><span class="dval">'+esc(row[1]||"-")+'</span></div></div>';
    }
  }
  return out;
}
(function(){
  var o=document.getElementById("out"),r=parseReceipt(location.hash);
  if(!r){o.innerHTML='<div class="bad"><b>No receipt data found</b><br><small style="color:#6b7280">Please scan the QR code on your receipt again.</small></div>';return}
  var th=themeFor(r.svc),st=document.documentElement.style;
  st.setProperty("--th",th.a);st.setProperty("--th2",th.b);
  var customerTop=document.getElementById("customerTop");
  var topName=String(r.name||"").trim();
  var topMobile=String(r.mobile||"").trim();
  if(topName && topName.toLowerCase()!=="customer"){
    customerTop.innerHTML='<span class="cnm">CUSTOMER NAME: '+esc(topName.toUpperCase())+'</span>'+(topMobile && topMobile!=="-"?'<span class="cmob">MOBILE: '+esc(topMobile)+'</span>':'');
    customerTop.style.display="flex";
  }
  var rows=[["Receipt No",r.no]];
  if(r.when) rows.push(["Date & Time",r.when]);
  var svc=String(r.svc||"").toLowerCase();

  function particularsForService(){
    var d=Array.isArray(r.details)?r.details.slice():[];
    var out=[];
    // V4.190: hide payment mode in the digital receipt for the specified services.
    if(/eb bill|eb\b|electric|loan|gpay|phonepe|upi|qr/.test(svc)){
      d=d.filter(function(x){
        return !(Array.isArray(x) && (String(x[0]||"")==="PM" || String(x[2]||"")==="PM"));
      });
    }
    function find(code){
      for(var i=0;i<d.length;i++){
        var x=d[i]||[];
        for(var j=0;j<x.length;j+=2){ if(String(x[j]||"")===code) return String(x[j+1]||""); }
      }
      return "";
    }
    if(/eb bill|eb\b|electric/.test(svc)){
      var ebName=find("NM") || r.name || "-";
      var ebNo=find("CN") || r.cno || "-";
      out.push(["NM",ebName,"CN",ebNo]);
      return out;
    }
    if(/loan/.test(svc)){
      var loanName=find("CM") || find("NM") || r.name || "-";
      var loanDetails=find("LD") || "";
      if(loanDetails) out.push(["CM",loanName,"LD",loanDetails]);
      else out.push(["CM",loanName]);
      return out;
    }
    if(/gpay|phonepe|upi/.test(svc) && !/qr/.test(svc)){
      out.push(["SN",r.name||"-","RN",find("RC")||"-"]);
      var ur=find("UR");
      out.push(["UT",ur||"-"]);
      return out;
    }
    if(/qr/.test(svc)){
      out.push(["SN",find("PB")||"-","RN",r.name||"-"]);
      var qUr=find("UR");
      out.push(["UT",qUr||"-"]);
      return out;
    }
    if(/mobile accessories/.test(svc)){
      var ma=[], keep={"PN":1,"PC":1,"PD":1};
      for(var i=0;i<d.length;i++){
        var x=d[i]||[];
        if(x.length>=4){
          var a=String(x[0]||""), b=String(x[2]||"");
          if(keep[a] && keep[b]) ma.push(x);
          else if(keep[a] && !b) ma.push([a,String(x[1]||"")]);
          else if(keep[b] && !a) ma.push([b,String(x[3]||"")]);
        }else if(x.length>=2 && keep[String(x[0]||"")]) ma.push(x);
      }
      return ma;
    }
    if(/money transfer|dmt/.test(svc)){
      var ben="", bank="", acc="";
      for(var i=0;i<d.length;i++){
        var x=d[i]||[];
        for(var j=0;j<x.length;j+=2){
          var code=String(x[j]||"");
          var val=String(x[j+1]||"");
          if(code==="BN") ben=val;
          else if(code==="BK") bank=val;
          else if(code==="AC") acc=val;
        }
      }
      out.push(["BN",ben||"-","BK",bank||"-"]);
      out.push(["AC",acc||"-"]);
      return out;
    }
    return d;
  }

  var details=particularsForService();
  var detailHtml=details.length?'<div class="detailsBox"><div class="detailsTitle">PARTICULARS / SERVICE DETAILS</div>'+renderDetailRows(details)+'</div>':'';
  var noChargeService=/xerox\/printout|stationary|mobile accessories/.test(svc);
  var receiptCharge=noChargeService?0:(Number(r.chg)||0);
  var receiptTotal=(Number(r.amt)||0)+receiptCharge;
  var amountTitle=th.l||"Amount";
  var amountBlock='<div class="brk"><div class="l"><span>'+amountTitle+'</span><b>'+money(r.amt)+'</b></div>'+
      (noChargeService?'':'<div class="l"><span>MDP Service Charge</span><b>'+money(receiptCharge)+'</b></div>')+
      '<div class="t"><span>NET TOTAL</span><b>'+money(receiptTotal)+'</b></div></div>';
  o.innerHTML=
   '<div class="bn"><div class="bi"><svg viewBox="0 0 24 24">'+ICO[th.i]+'</svg></div><div><b>'+th.t+'</b></div></div>'+ 
   '<div class="tear"></div>'+ 
   '<div class="rows">'+rows.map(function(x){return '<div class="row"><span>'+x[0]+'</span><span>'+esc(x[1])+'</span></div>'}).join("")+'</div>'+ 
   detailHtml+amountBlock+
   '<div class="btns"><a class="b1" href="tel:7871611999">&#128222; Call Shop</a><a class="b2" href="'+REVIEW_URL+'" target="_blank" rel="noopener">&#9733; Rate 5 Stars</a></div>';
})();
