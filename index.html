<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#011E53">
<title>Receipt Details - Maharaaj Digi Point</title>
<style>
:root{--navy:#011E53;--org:#FE6E01;--mut:#6b7280;--ln:#e7e9ee;--th:#011E53;--th2:#0a3aa8}
*{box-sizing:border-box}
html{min-height:100%;background:var(--navy)}
body{margin:0;min-height:100vh;padding:22px 14px 30px;color:#111827;
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;
  background:radial-gradient(900px 420px at 85% 108%,rgba(254,110,1,.55),transparent 60%),
             radial-gradient(700px 380px at 5% -10%,rgba(77,124,255,.35),transparent 60%),
             linear-gradient(165deg,#011E53,#04339a 70%,#011E53)}
.wrap{max-width:420px;margin:0 auto}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:up .6s ease both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.top{padding:20px 20px 14px;text-align:center;background:#fff}
.top img{width:172px;height:auto;display:block;margin:0 auto}
/* animated brand line */
.bar{position:relative;height:6px;overflow:hidden;
  background:linear-gradient(90deg,#011E53,#1d4fd8,#FE6E01,#1d4fd8,#011E53);background-size:200% 100%;
  animation:flow 3.2s linear infinite}
.bar:after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:30%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:glint 2.2s ease-in-out infinite}
@keyframes flow{to{background-position:-200% 0}}
@keyframes glint{to{left:130%}}
/* service heading banner */
.bn{position:relative;overflow:hidden;margin:16px 16px 0;border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;color:#fff;
  background:linear-gradient(135deg,var(--th),var(--th2));box-shadow:0 10px 20px -8px var(--th);animation:up .6s .1s ease both}
.bn:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.bn .bi{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.bn svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn b{display:block;font-size:17px;letter-spacing:.4px;line-height:1.2}
.bn small{opacity:.92;font-size:12px;letter-spacing:.3px}
.hero{text-align:center;padding:18px 20px 6px;animation:up .6s .2s ease both}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.amt{font-size:42px;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1.15}
.amt i{font-style:normal;color:var(--th);margin-right:4px}
.svc{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:99px;background:#eef2ff;color:var(--th);font-weight:700;font-size:13px}
.brk{margin:16px 18px 0;border:1px solid var(--ln);border-radius:16px;overflow:hidden;animation:up .6s .2s ease both}
.brk .l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f1f5}
.brk .l span{color:var(--mut);font-size:14px}
.brk .l b{font-size:17px;color:#111827;white-space:nowrap}
.brk .t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--th),var(--th2))}
.brk .t span{font-weight:800;letter-spacing:.8px;font-size:14px}
.brk .t b{font-size:25px;font-weight:800;white-space:nowrap}
.tear{margin:16px 18px 4px;border-top:2px dashed var(--ln)}
.rows{padding:2px 22px 8px;animation:up .6s .3s ease both}
.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #f0f1f5}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--mut);font-size:14px;white-space:nowrap}
.row span:last-child{font-weight:700;text-align:right;word-break:break-word}

.metaTop{margin:10px 18px 0;border:1px solid var(--ln);border-radius:12px;padding:9px 12px;background:#f9fbff;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;animation:up .6s .05s ease both}
.metaTop .mi{min-width:0;display:flex;align-items:center;gap:7px}
.metaTop .ml{font-size:11px;color:var(--mut);font-weight:800;white-space:nowrap}
.metaTop .mv{font-size:13px;color:#111827;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metaTop .mi:last-child{justify-content:flex-end}.metaTop .mi:last-child .mv{text-align:right}
@media(max-width:360px){.metaTop{grid-template-columns:1fr;gap:7px}.metaTop .mi:last-child{justify-content:flex-start}.metaTop .mi:last-child .mv{text-align:left}}
.customerTop{margin:12px 18px 0;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;background:#f9fbff;display:flex;justify-content:space-between;gap:12px;align-items:center}
.customerTop .cnm{font-size:13px;font-weight:800;color:#111827;word-break:break-word}
.customerTop .cmob{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap}
.detailsBox{margin:12px 18px 0;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:#fff}
.detailsTitle{padding:9px 13px;background:#f4f7fb;color:var(--navy);font-size:11px;font-weight:900;letter-spacing:.7px}
.drow{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #f0f1f5}
.drow.one{grid-template-columns:1fr}
.dpair{padding:8px 11px;min-width:0}
.dpair + .dpair{border-left:1px solid #f0f1f5}
.dlab{display:block;color:var(--mut);font-size:10.5px;font-weight:800;margin-bottom:2px}
.dval{display:block;color:#111827;font-size:13.5px;font-weight:800;line-height:1.25;word-break:break-word}
.btns{display:flex;gap:10px;padding:8px 20px 18px}
.btns a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:12px 8px;border-radius:12px}
.b1{background:var(--navy);color:#fff}
.b2{background:#fff3e8;color:#c24e00;border:1px solid #ffd2ad}
.thx{background:linear-gradient(90deg,var(--navy),#0a3aa8);color:#fff;text-align:center;padding:14px 16px}
.thx b{display:block;font-size:15px}
.thx small{opacity:.8;font-size:12px}
.ft{padding:14px 20px 18px;text-align:center;font-size:12px;color:var(--mut)}
.bad{padding:30px 22px;text-align:center}
.note{max-width:420px;margin:16px auto 0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.72)}
@media(prefers-reduced-motion:reduce){.card,.bn,.hero,.rows,.brk{animation:none}.bar,.bar:after,.bn:after{animation:none}}
</style>
</head>

function b64ToUtf8(s){
  s=String(s||"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  try{
    var bin=atob(s),bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(window.TextDecoder) return new TextDecoder("utf-8").decode(bytes);
    var esc=""; for(var j=0;j<bytes.length;j++) esc+="%"+("0"+bytes[j].toString(16)).slice(-2);
    return decodeURIComponent(esc);
  }catch(e){return ""}
}
function parseReceipt(h){
  h=(h||"").replace(/^#/ , "");
  if(!h) return null;
  /* V4.195 compact self-contained QR: #q/<service>/<receipt>/<amt>/<chg>/<date>/<name>/<mobile>/... */
  if(h.indexOf("q/")===0){
    try{
      var p=h.slice(2).split("/").map(function(s){try{return decodeURIComponent(s)}catch(e){return s}});
      if(p.length<7) return null;
      var code=p[0], amt=parseFloat(p[2]), chg=parseFloat(p[3]);
      if(!isFinite(amt)) return null;
      var ds=String(p[4]||""), when="";
      if(/^\d{10}$/.test(ds)){
        when=ds.slice(0,2)+"-"+ds.slice(2,4)+"-20"+ds.slice(4,6)+", "+( +ds.slice(6,8) >= 12 ? ((+ds.slice(6,8)-12||12)+":"+ds.slice(8,10)+" PM") : ((+ds.slice(6,8)||12)+":"+ds.slice(8,10)+" AM") );
      }
      return {no:p[1]||"",svc:serviceName(code),code:code,amt:amt,chg:isFinite(chg)?chg:0,when:when,name:p[5]||"",mobile:p[6]||"",details:p.slice(7),compact:true};
    }catch(e){return null}
  }
  /* Older full-particulars QR */
  if(h.indexOf("v2/")===0){
    try{
      var data=JSON.parse(b64ToUtf8(h.slice(3)));
      if(!data || !data.n || !data.s || !isFinite(parseFloat(data.a))) return null;
      var d="", ds=String(data.d||"");
      if(/^\d{12}$/.test(ds)){
        var hh=+ds.slice(8,10),ap=hh>=12?"PM":"AM"; hh=hh%12||12;
        d=ds.slice(6,8)+"-"+ds.slice(4,6)+"-"+ds.slice(0,4)+", "+(hh<10?"0":"")+hh+":"+ds.slice(10,12)+" "+ap;
      }
      return {no:String(data.n||""),svc:String(data.s||""),code:"",amt:parseFloat(data.a)||0,chg:parseFloat(data.c)||0,when:d,name:String(data.cn||""),mobile:String(data.cm||""),details:Array.isArray(data.p)?data.p:[],compact:false};
    }catch(e){ return null; }
  }
  /* Backward-compatible old QR format */
  var p=h.split("/").map(function(s){try{return decodeURIComponent(s).replace(/_/g," ")}catch(e){return s}});
  if(p.length<4) return null;
  var amt=parseFloat(p[2]); if(!isFinite(amt)) return null;
  var old=/^\d{12}$/.test(p[3]),chg=0,i=3;
  if(!old){if(p.length<5)return null;chg=parseFloat(p[3]);if(!isFinite(chg))chg=0;i=4}
  var when="";
  if(/^\d{12}$/.test(p[i])){var d=p[i],hh=+d.slice(8,10),ap=hh>=12?"PM":"AM";hh=hh%12||12;when=d.slice(6,8)+"-"+d.slice(4,6)+"-"+d.slice(0,4)+", "+(hh<10?"0":"")+hh+":"+d.slice(10,12)+" "+ap}
  return {no:p[0],svc:p[1],code:"",amt:amt,chg:chg,when:when,name:p[i+1]||"",mobile:"",details:[],compact:false};
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "&#8377; "+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function pair(a,b){return [a||"",b||""]}
function detailBox(title, rows){
  if(!rows.length) return "";
  return '<div class="detailsBox"><div class="detailsTitle">'+esc(title)+'</div>'+rows.map(function(x){
    if(x.length>=4) return '<div class="drow"><div class="dpair"><span class="dlab">'+esc(x[0])+'</span><span class="dval">'+esc(x[1]||"-")+'</span></div><div class="dpair"><span class="dlab">'+esc(x[2])+'</span><span class="dval">'+esc(x[3]||"-")+'</span></div></div>';
    return '<div class="drow one"><div class="dpair"><span class="dlab">'+esc(x[0])+'</span><span class="dval">'+esc(x[1]||"-")+'</span></div></div>';
  }).join("")+'</div>';
}
function renderCompactDetails(r){
  var p=r.details||[], code=r.code, rows=[];
  if(code==="u") rows=[pair("பணம் அனுப்புபவர்",r.name),pair("பணம் பெறுபவர்",p[0]),pair("UTR எண்",p[1])];
  else if(code==="q") rows=[pair("பணம் அனுப்புபவர்",p[0]),pair("பணம் பெறுபவர்",p[1]),pair("UTR எண்",p[2])];
  else if(code==="rq") rows=[pair("பணம் செலுத்துபவர்",p[0]),pair("Payer VPA",p[1]),pair("Reference",p[2])];
  else if(code==="e") rows=[pair("Customer Name",r.name),pair("Consumer Number",p[0]),pair("Bill Details",p[1])];
  else if(code==="l") rows=[pair("Customer Name",r.name),pair("Loan Details",p[0])];
  else if(code==="m") rows=[pair("Sender Name",r.name),pair("Beneficiary Name",p[0]),pair("Bank Name",p[1]),pair("Account Number",p[2])];
  else if(code==="ma") rows=[pair("Product Name",p[0]),pair("Product Code",p[1]),pair("Product Details",p[2])];
  else if(code==="r") rows=[pair("Mobile Number",p[0]),pair("Recharge Details",p[1])];
  else if(code==="d") rows=[pair("DTH Provider",p[0]),pair("DTH Number",p[1]),pair("Customer Mobile",p[2])];
  else if(p.length) rows=[pair("Details",p.join(" • "))];
  return rows;
}
(function(){
  var o=document.getElementById("out"),r=parseReceipt(location.hash);

  st.setProperty("--th",th.a);st.setProperty("--th2",th.b);

  var showMobile=!(serviceCode==="u"||serviceCode==="q"||serviceCode==="rq"||serviceCode==="e"||serviceCode==="l"||serviceCode==="m"||serviceCode==="a"||serviceCode==="t");

                    '<div class="mi"><span class="ml">Date & Time</span><span class="mv">'+esc(r.when||"-")+'</span></div>';
  metaTop.style.display="grid";

  var customerTop=document.getElementById("customerTop");
  if(r.name && r.name.toLowerCase()!=="customer"){
    customerTop.innerHTML='<span class="cnm">CUSTOMER NAME: '+esc(r.name.toUpperCase())+'</span>'+(showMobile&&r.mobile?'<span class="cmob">MOBILE: '+esc(r.mobile)+'</span>':'');
    customerTop.style.display="flex";
  }
  var details=renderCompactDetails(r);

  var charge=noCharge?0:Number(r.chg||0), total=Number(r.amt||0)+charge;
  var amountHtml='<div class="brk"><div class="l"><span>'+esc(th.l||"Amount")+'</span><b>'+money(r.amt)+'</b></div>'+(noCharge?'':'<div class="l"><span>MDP Service Charge</span><b>'+money(charge)+'</b></div>')+'<div class="t"><span>NET TOTAL</span><b>'+money(total)+'</b></div></div>';
  o.innerHTML='<div class="bn"><div class="bi"><svg viewBox="0 0 24 24">'+ICO[th.i]+'</svg></div><div><b>'+esc(th.t)+'</b></div></div>'+detailsHtml+amountHtml+'<div class="btns"><a class="b1" href="tel:7871611999">&#128222; Call Shop</a><a class="b2" href="'+REVIEW_URL+'" target="_blank" rel="noopener">&#9733; Rate 5 Stars</a></div>';
})();
